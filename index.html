<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vishwakarma Electrical Workshop | Premium Power Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* UNIQUE PREMIUM THEME */
    :root {
      --bg-body: #f8fafc;
      --header-bg: #0f172a; /* Deep Navy */
      --primary: #e11d48; /* Premium Red/Orange */
      --primary-hover: #be123c;
      --secondary: #f59e0b; /* Golden Yellow */
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --white: #ffffff;
      --whatsapp: #25D366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); }

    /* HEADER */
    header { background-color: var(--header-bg); color: var(--white); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 15px 5%; gap: 20px; }
    
    .logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; letter-spacing: -0.5px; }
    .logo span { font-size: 0.8rem; color: var(--secondary); display: block; font-weight: 500; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
    
    .search-bar { flex-grow: 1; max-width: 600px; display: flex; height: 45px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: 0.3s; background: var(--white); }
    .search-bar:focus-within { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
    .search-bar input { flex-grow: 1; padding: 0 15px; border: none; outline: none; font-size: 1rem; color: var(--text-main); }
    .search-bar button { background: var(--primary); color: var(--white); border: none; padding: 0 25px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .search-bar button:hover { background: var(--primary-hover); }
    
    .nav-icons { display: flex; gap: 25px; align-items: center; }
    .nav-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--white); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.2s; }
    .nav-item:hover { color: var(--secondary); }
    .nav-item .icon { font-size: 1.4rem; }
    .nav-item .text-wrap { display: flex; flex-direction: column; }
    .nav-item .text-wrap span { font-size: 0.75rem; color: #94a3b8; }
    
    .cart-btn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--white); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; position: relative; transition: 0.2s; }
    .cart-btn:hover { background: rgba(255,255,255,0.2); }
    .cart-btn .cart-count { position: absolute; top: -8px; right: -8px; background: var(--primary); color: var(--white); font-size: 0.8rem; font-weight: bold; padding: 2px 7px; border-radius: 50%; }

    /* HERO SECTION */
    .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--white); text-align: center; padding: 70px 20px; margin-bottom: 30px; position: relative; overflow: hidden; }
    .hero-banner::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(245,158,11,0.1) 0%, transparent 60%); pointer-events: none; }
    .hero-banner h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -1px; }
    .hero-banner p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }

    /* MAIN CONTAINER */
    .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px 20px; }

    /* PRODUCT GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    
    .card { background: var(--white); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid var(--border); position: relative; }
    .card:hover { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); transform: translateY(-5px); border-color: #cbd5e1; }
    
    .card-img { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px; background: #f1f5f9; border-radius: 8px; }
    .card-img img { max-width: 90%; max-height: 90%; object-fit: contain; transition: transform 0.5s; mix-blend-mode: multiply; }
    .card:hover .card-img img { transform: scale(1.08); }
    
    .brand-tag { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; line-height: 1.4; color: var(--text-main); }
    
    .price-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; margin-top: auto; }
    .price-current { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }
    .price-old { font-size: 1rem; color: var(--text-muted); text-decoration: line-through; }
    
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-cart { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
    .btn-cart:hover { background: #e2e8f0; }
    .btn-buy { background: var(--primary); color: var(--white); box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
    .btn-buy:hover { background: var(--primary-hover); box-shadow: 0 6px 15px rgba(225, 29, 72, 0.4); }

    /* SIDEBARS & MODALS */
    .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; }
    .cart-overlay.active { opacity: 1; visibility: visible; }
    .cart-sidebar { position: fixed; top: 0; right: -450px; width: 100%; max-width: 420px; height: 100%; background: var(--white); z-index: 1001; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
    .cart-sidebar.active { right: 0; }
    .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .close-cart { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }
    .cart-items { flex-grow: 1; padding: 20px; overflow-y: auto; background: var(--bg-body); }
    
    .cart-item { display: flex; gap: 15px; margin-bottom: 15px; background: var(--white); padding: 15px; border-radius: 12px; align-items: center; border: 1px solid var(--border); }
    .cart-item img { width: 60px; height: 60px; object-fit: contain; }
    .cart-item-info h4 { font-size: 0.9rem; margin-bottom: 5px; font-weight: 600; }
    .cart-item-info p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    .remove-item { background: #fee2e2; border: none; color: #ef4444; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; margin-left: auto; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .remove-item:hover { background: #fecaca; }
    
    .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--white); }
    .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
    .btn-checkout { width: 100%; background: var(--primary); color: var(--white); padding: 15px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
    .btn-checkout:hover { background: var(--primary-hover); }

    /* MODALS (Checkout & Login) */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--white); width: 90%; max-width: 450px; padding: 30px; border-radius: 16px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); transform: translateY(20px); transition: 0.3s; }
    .modal.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 20px; right: 20px; background: var(--bg-body); border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    
    .modal-content h2 { margin-bottom: 25px; font-size: 1.5rem; font-weight: 800; color: var(--header-bg); }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; color: var(--text-main); }
    .input-group input, .input-group textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: 0.2s; }
    .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(225,29,72,0.1); }
    
    .btn-submit { width: 100%; background: var(--whatsapp); color: var(--white); font-size: 1.1rem; padding: 15px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; transition: 0.2s; }
    .btn-submit:hover { background: #1da851; box-shadow: 0 4px 15px rgba(37,211,102,0.4); }

    /* FLOATING WHATSAPP */
    .float-wa { position: fixed; bottom: 25px; right: 25px; background: var(--whatsapp); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(37,211,102,0.3); z-index: 500; transition: 0.3s; animation: pulse 2s infinite; }
    .float-wa:hover { transform: scale(1.1) translateY(-5px); }
    .float-wa img { width: 35px; height: 35px; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.5); } 70% { box-shadow: 0 0 0 15px rgba(37,211,102,0); } 100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); } }

    @media (max-width: 768px) {
      .top-nav { padding: 10px 15px; flex-wrap: wrap; }
      .search-bar { order: 3; width: 100%; margin-top: 10px; max-width: 100%; }
      .nav-item .text-wrap { display: none; } /* Hide text on mobile */
      .hero-banner h1 { font-size: 2rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
      .card { padding: 15px; }
      .card-img { height: 150px; }
      .card-title { font-size: 0.9rem; }
      .price-current { font-size: 1.3rem; }
      .btn { font-size: 0.85rem; padding: 10px; }
      .cart-sidebar { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-nav">
      <div class="logo" onclick="window.scrollTo(0,0)">
        Vishwakarma <span>Electrical Workshop</span>
      </div>
      
      <div class="search-bar">
        <input type="text" placeholder="Search for tools, grinders, drills...">
        <button>Search</button>
      </div>

      <div class="nav-icons">
        <!-- Profile / Authentication -->
        <a href="javascript:void(0)" class="nav-item" onclick="openLogin()">
          <span class="icon">👤</span>
          <div class="text-wrap">
            <span>Hello, Sign in</span>
            <strong style="font-size: 0.95rem;">Account & Orders</strong>
          </div>
        </a>
        
        <button class="cart-btn" onclick="toggleCart()">
          <span>🛒</span>
          <span class="cart-count" id="cart-count">0</span>
          <span style="margin-left: 5px;">Cart</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO BANNER -->
  <div class="hero-banner">
    <h1>Power Up Your Work</h1>
    <p>Koderma's #1 destination for premium power tools and expert repair services.</p>
  </div>

  <!-- PRODUCTS -->
  <div class="container" id="products">
    <div class="grid" id="product-grid"></div>
  </div>

  <!-- CART SIDEBAR -->
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-cart" onclick="toggleCart()">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Subtotal:</span>
        <span id="cart-total">₹0</span>
      </div>
      <button class="btn-checkout" onclick="openCheckout()">Proceed to Buy</button>
    </div>
  </div>

  <!-- LOGIN / AUTHENTICATION MODAL -->
  <div class="modal" id="login-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeLogin()">×</button>
      <h2>Sign In / Sign Up</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Enter your details to save your account and track orders.</p>
      <form id="login-form" onsubmit="saveLogin(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="login-name" required placeholder="Enter your name">
        </div>
        <div class="input-group">
          <label>Mobile Number</label>
          <input type="tel" id="login-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
        </div>
        <button type="submit" class="btn btn-buy" style="width: 100%; padding: 15px;">Continue</button>
      </form>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeCheckout()">×</button>
      <h2>Delivery Details</h2>
      
      <form id="checkout-form" onsubmit="submitOrder(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="cust-name" required placeholder="Enter your full name">
        </div>
        <div class="input-group">
          <label>Mobile Number</label>
          <input type="tel" id="cust-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
        </div>
        <div class="input-group">
          <label>Full Address (with Pincode)</label>
          <textarea id="cust-address" required placeholder="House No, Street, Area, Pincode" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-submit">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="24" alt="WA"> Order via WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- FLOATING WHATSAPP LOGO -->
  <a href="https://wa.me/916200973301?text=Namaste%2C%20mujhe%20power%20tools%20ke%20baare%20mein%20jaankari%20chahiye" class="float-wa" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
  </a>

  <!-- JAVASCRIPT -->
  <script>
    const WA_NUMBER = "916200973301";
    
    // Products (Reliable images)
    const products = [
      { id: 1, name: "Dong Cheng Angle Grinder DSM08-100", brand: "Dong Cheng", price: 2199, oldPrice: 2800, img: "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=400&q=80" },
      { id: 2, name: "Dong Cheng Angle Grinder DSM02-125B", brand: "Dong Cheng", price: 3200, oldPrice: 4000, img: "https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=400&q=80" },
      { id: 3, name: "Dong Cheng Marble Cutter DZE03-110", brand: "Dong Cheng", price: 2500, oldPrice: 3100, img: "https://images.unsplash.com/photo-1581147036324-c1c88bb6b0f4?w=400&q=80" },
      { id: 4, name: "Dong Cheng Impact Drill DZJ02-13", brand: "Dong Cheng", price: 1950, oldPrice: 2500, img: "https://images.unsplash.com/photo-1426927308491-6380b6a9936f?w=400&q=80" },
      { id: 5, name: "Dong Cheng Electric Planer DMB82", brand: "Dong Cheng", price: 2879, oldPrice: 3500, img: "https://images.unsplash.com/photo-1620056378445-0b7e1c7e0b8f?w=400&q=80" },
      { id: 6, name: "Gaocheng Electric Planer GC-H82P", brand: "Gaocheng", price: 2430, oldPrice: 3000, img: "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=400&q=80" },
      { id: 7, name: "Camron Pro Marble Cutter CP-MC-125MB", brand: "Camron Pro", price: 3470, oldPrice: 4200, img: "https://images.unsplash.com/photo-1581147036324-c1c88bb6b0f4?w=400&q=80" },
      { id: 8, name: "Hikoki Impact Drill DV 10VST", brand: "Hikoki", price: 2339, oldPrice: 2900, img: "https://images.unsplash.com/photo-1426927308491-6380b6a9936f?w=400&q=80" }
    ];

    let cart = [];
    let currentUser = null;

    // Render Products
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = products.map(p => `
        <div class="card">
          <div class="card-img">
            <img src="${p.img}" alt="${p.name}">
          </div>
          <div class="brand-tag">${p.brand}</div>
          <h3 class="card-title">${p.name}</h3>
          <div class="price-row">
            <span class="price-current">₹${p.price.toLocaleString('en-IN')}</span>
            <span class="price-old">₹${p.oldPrice.toLocaleString('en-IN')}</span>
          </div>
          <div class="btn-group">
            <button class="btn btn-cart" onclick="addToCart(${p.id})">Add to Cart</button>
            <button class="btn btn-buy" onclick="buyNow(${p.id})">Buy Now</button>
          </div>
        </div>
      `).join('');
    }

    // --- AUTHENTICATION LOGIC ---
    function openLogin() {
      document.getElementById('login-modal').classList.add('active');
    }
    function closeLogin() {
      document.getElementById('login-modal').classList.remove('active');
    }
    function saveLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-name').value;
      const phone = document.getElementById('login-phone').value;
      
      currentUser = { name, phone };
      
      // Update Header UI
      const profileDiv = document.querySelector('.nav-item .text-wrap');
      profileDiv.innerHTML = `<span>Hello, ${name.split(' ')[0]}</span><strong style="font-size: 0.95rem;">My Account</strong>`;
      
      closeLogin();
      alert("Login Successful! Welcome " + name);
    }

    // --- CART LOGIC ---
    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('active');
      document.getElementById('cart-overlay').classList.toggle('active');
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) { item.qty += 1; } 
      else {
        const product = products.find(p => p.id === id);
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      if(!document.getElementById('cart-sidebar').classList.contains('active')){ toggleCart(); }
    }

    function buyNow(id) {
      cart = [{ ...products.find(p => p.id === id), qty: 1 }];
      updateCartUI();
      openCheckout();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      const cartItemsDiv = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotal = document.getElementById('cart-total');
      
      let total = 0, count = 0;
      
      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">Your cart is empty.</p>';
      } else {
        cartItemsDiv.innerHTML = cart.map(item => {
          total += item.price * item.qty;
          count += item.qty;
          return `
            <div class="cart-item">
              <img src="${item.img}" alt="${item.name}">
              <div class="cart-item-info">
                <h4>${item.name}</h4>
                <p>₹${item.price} x ${item.qty}</p>
              </div>
              <button class="remove-item" onclick="removeFromCart(${item.id})">×</button>
            </div>
          `;
        }).join('');
      }
      cartCount.innerText = count;
      cartTotal.innerText = `₹${total.toLocaleString('en-IN')}`;
    }

    // --- CHECKOUT LOGIC ---
    function openCheckout() {
      if (cart.length === 0) { alert("Your cart is empty!"); return; }
      toggleCart(); 
      
      // Auto-fill if logged in
      if (currentUser) {
        document.getElementById('cust-name').value = currentUser.name;
        document.getElementById('cust-phone').value = currentUser.phone;
      }
      
      document.getElementById('checkout-modal').classList.add('active');
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').classList.remove('active');
    }

    function submitOrder(e) {
      e.preventDefault();
      
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      
      let total = 0, productListText = "";
      
      cart.forEach((item, index) => {
        total += item.price * item.qty;
        productListText += `\n${index + 1}. ${item.name} (Qty: ${item.qty}) - ₹${item.price * item.qty}`;
      });

      const message = `*🏪 Vishwakarma Electrical Workshop*\n\n` +
                      `*👤 Name:* ${name}\n` +
                      `*📱 Phone:* ${phone}\n` +
                      `*📍 Address:* ${address}\n\n` +
                      `*🛒 Order Details:*${productListText}\n\n` +
                      `*💰 Total Amount:* ₹${total.toLocaleString('en-IN')}\n\n` +
                      `*Payment:* I am ready to pay via UPI. Please share the QR code/UPI ID.`;
      
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
      
      cart = [];
      updateCartUI();
      closeCheckout();
      document.getElementById('checkout-form').reset();
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderProducts();
      updateCartUI();
    });
  </script>
</body>
</html>
